<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dynamic Map Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #111;
            color: #f5f5f5;
        }

        .controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }

        #projection-select {
            font: inherit;
            padding: 0.2rem 0.4rem;
        }

        #map {
            width: 100%;
            height: 100vh;
            display: block;
        }

        path.ocean {
            fill: #0b223a;
            stroke: #9bbad6;
            stroke-width: 0.8;
        }

        path.graticule {
            fill: none;
            stroke: #56789a;
            stroke-width: 0.4;
            stroke-opacity: 0.55;
            vector-effect: non-scaling-stroke;
        }

        path.country-fill {
            fill: #a7c5eb;
            stroke: none;
        }

        path.country-border {
            fill: none;
            stroke: #1f3550;
            stroke-width: 0.8;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
        }

        .tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 0.25rem;
            padding: 0.2rem 0.4rem;
            font-size: 0.8rem;
            transform: translate(10px, 10px);
            display: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <header class="controls">
        <label for="projection-select">Projection</label>
        <select id="projection-select">
            <option value="mercator">Mercator</option>
            <option value="equalEarth" selected>Equal Earth</option>
            <option value="orthographic">Orthographic</option>
            <option value="naturalEarth1">Natural Earth</option>
            <option value="spilhaus">Spilhaus Ocean</option>
        </select>
    </header>

    <svg id="map" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tooltip" class="tooltip"></div>

    <script>
        const svg = d3.select('#map');
        const tooltip = d3.select('#tooltip');
        const projectionSelect = document.getElementById('projection-select');

        const sphereFeature = { type: 'Sphere' };
        const graticule = d3.geoGraticule();
        const mapLayer = svg.append('g').attr('class', 'map-layer');
        const zoomBehavior = d3.zoom()
            .scaleExtent([1, 8])
            .on('zoom', (event) => {
                mapLayer.attr('transform', event.transform);
            });

        svg.call(zoomBehavior);

        let currentProjection;
        let pathGenerator;
        let oceanSelection;
        let graticuleSelection;
        let countrySelection;
        let borderSelection;

        function getSize() {
            const node = svg.node();
            const bounds = node.getBoundingClientRect();
            const width = bounds.width || 1000;
            const height = bounds.height || 600;
            return { width, height };
        }

        function projectionFactory(width, height) {
            return {
                mercator: () => d3.geoMercator().scale(width / (2 * Math.PI)).translate([width / 2, height / 2]),
                equalEarth: () => d3.geoEqualEarth().scale(width * 0.17).translate([width / 2, height / 2]),
                orthographic: () => d3.geoOrthographic().scale(Math.min(width, height) * 0.45).translate([width / 2, height / 2]).clipAngle(90),
                naturalEarth1: () => d3.geoNaturalEarth1().scale(width * 0.19).translate([width / 2, height / 2]),
                spilhaus: () => d3.geoStereographic().rotate([-66.95, 49.56, 45]).clipAngle(140).scale(Math.min(width, height) * 0.95).translate([width / 2, height / 2])
            };
        }

        function setProjection(key, rerenderOnly = false) {
            const { width, height } = getSize();
            const factories = projectionFactory(width, height);
            const newProjection = (factories[key] || factories.equalEarth)();

            currentProjection = newProjection;
            if (!pathGenerator) {
                pathGenerator = d3.geoPath().projection(currentProjection);
            } else {
                pathGenerator.projection(currentProjection);
            }

            const mapSelections = [oceanSelection, graticuleSelection, countrySelection, borderSelection].filter(Boolean);
            for (const selection of mapSelections) {
                const transition = rerenderOnly ? selection : selection.transition().duration(500);
                transition.attr('d', pathGenerator);
            }

            if (!rerenderOnly) {
                svg.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity);
            }
        }

        d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then((world) => {
            const countries = topojson.feature(world, world.objects.countries).features;
            const countryBorders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

            oceanSelection = mapLayer.append('path')
                .datum(sphereFeature)
                .attr('class', 'ocean');

            graticuleSelection = mapLayer.append('path')
                .datum(graticule())
                .attr('class', 'graticule');

            countrySelection = mapLayer.append('g')
                .attr('class', 'countries')
                .selectAll('path.country-fill')
                .data(countries)
                .enter()
                .append('path')
                .attr('class', 'country-fill')
                .on('mousemove', (event, feature) => {
                    tooltip
                        .style('display', 'block')
                        .style('left', `${event.clientX}px`)
                        .style('top', `${event.clientY}px`)
                        .text(feature.properties?.name || 'Country');
                })
                .on('mouseleave', () => tooltip.style('display', 'none'));

            borderSelection = mapLayer.append('path')
                .datum(countryBorders)
                .attr('class', 'country-border');

            setProjection(projectionSelect.value);
        });

        projectionSelect.addEventListener('change', (event) => {
            setProjection(event.target.value);
        });

        window.addEventListener('resize', () => {
            if (countrySelection) {
                setProjection(projectionSelect.value, true);
            }
        });
    </script>
</body>
</html>
